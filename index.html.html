<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Gerador de assinatura | Cohab Minas</title>
    <style>
        :root {
            --terra: #b94729;
            --terra-dark: #9a3a20;
            --gray: #4a4a4a;
            --ink: #1f2124;
            --muted: #6b7075;
            --line: #e3e6e9;
            --page: #eef0f2;
            --ease: cubic-bezier(.22, .8, .24, 1);
        }

        * { box-sizing: border-box }

        html { scroll-behavior: smooth }

        body {
            margin: 0;
            background: var(--page);
            color: var(--ink);
            font-family: Calibri, Arial, sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* fundo: duas formas suaves em movimento lento */
        .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden }
        .bg span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5 }
        .bg span:nth-child(1) { width: 520px; height: 520px; background: #f3c9bb; top: -160px; right: -120px; animation: drift1 22s ease-in-out infinite alternate }
        .bg span:nth-child(2) { width: 460px; height: 460px; background: #d5dae0; bottom: -180px; left: -140px; animation: drift2 26s ease-in-out infinite alternate }
        @keyframes drift1 { to { transform: translate(-90px, 70px) scale(1.12) } }
        @keyframes drift2 { to { transform: translate(110px, -60px) scale(1.08) } }

        .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 24px 16px }

        /* cabeçalho */
        .hero { margin-bottom: 26px; padding-left: 20px; position: relative }
        .hero::before {
            content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 6px; border-radius: 3px;
            background: var(--terra); transform-origin: top; animation: grow .8s var(--ease) both
        }
        .hero h1 { margin: 0 0 8px; font-size: clamp(28px, 4.4vw, 42px); line-height: 1.1; letter-spacing: -.01em }
        .hero p { margin: 0; max-width: 62ch; color: var(--muted); font-size: 17px; line-height: 1.5 }
        @keyframes grow { from { transform: scaleY(0) } to { transform: scaleY(1) } }

        .panel {
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 26px;
            box-shadow: 0 1px 2px #1f21240a, 0 12px 32px -12px #1f212426;
            margin-bottom: 22px;
            transition: box-shadow .35s var(--ease), transform .35s var(--ease);
        }
        .panel:hover { box-shadow: 0 1px 2px #1f21240a, 0 18px 40px -14px #1f212433 }

        .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px }

        label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; color: var(--gray); transition: color .2s }
        .fields > div:focus-within label { color: var(--terra) }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #d3d7db;
            border-radius: 8px;
            background: #fafbfb;
            color: var(--ink);
            font: 16px Calibri, Arial, sans-serif;
            transition: border-color .2s, box-shadow .25s, background .2s;
        }
        input::placeholder { color: #a2a7ac }
        input:hover { border-color: #b8bdc2 }
        input:focus { outline: none; background: #fff; border-color: var(--terra); box-shadow: 0 0 0 4px #b9472926 }

        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 0 }

        button {
            position: relative;
            overflow: hidden;
            border: 0;
            border-radius: 8px;
            padding: 13px 22px;
            font: bold 16px Calibri, Arial, sans-serif;
            cursor: pointer;
            background: var(--terra);
            color: #fff;
            box-shadow: 0 6px 16px -6px #b9472999;
            transition: transform .2s var(--ease), box-shadow .25s, background .2s;
        }
        button::after {
            content: ""; position: absolute; top: 0; left: -80%; width: 50%; height: 100%;
            background: linear-gradient(100deg, transparent, #ffffff40, transparent);
            transform: skewX(-20deg); transition: left .6s var(--ease);
        }
        button:hover { background: var(--terra-dark); transform: translateY(-2px); box-shadow: 0 10px 20px -8px #b94729b3 }
        button:hover::after { left: 130% }
        button:active { transform: translateY(0) scale(.98) }
        button:focus-visible { outline: 3px solid #b947294d; outline-offset: 3px }
        button.secondary { background: #555; box-shadow: 0 6px 16px -8px #0006 }
        button.secondary:hover { background: #3f3f3f }
        button.done { background: #2f7d4f !important }

        /* prévia */
        .preview-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-weight: 700; color: var(--gray); font-size: 15px }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--terra); position: relative }
        .live-dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--terra); animation: ping 2s ease-out infinite }
        @keyframes ping { from { transform: scale(1); opacity: .6 } to { transform: scale(3.2); opacity: 0 } }

        .preview {
            overflow: auto;
            background: #fff;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            box-shadow: inset 0 0 0 1px #fff, 0 8px 24px -16px #1f212440;
        }
        .preview.tick { animation: tick .45s var(--ease) }
        @keyframes tick { 0% { box-shadow: 0 0 0 0 #b9472940 } 100% { box-shadow: 0 0 0 14px #b9472900 } }

        canvas { width: 100%; height: auto; display: block; min-width: 700px }

        .note { font-size: 13px; color: var(--muted) }

        footer {
            position: relative; z-index: 1; text-align: center; padding: 22px 12px 30px;
            font: 13px Calibri, Arial, sans-serif; color: var(--muted)
        }

        /* aviso de exportação */
        .toast {
            position: fixed; left: 50%; bottom: 28px; z-index: 10;
            transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
            background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px;
            font: bold 15px Calibri, Arial, sans-serif;
            box-shadow: 0 12px 30px -10px #0008;
            transition: opacity .3s, transform .4s var(--ease);
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0) }

        /* entrada: uma única sequência ao carregar */
        .rise { opacity: 0; transform: translateY(18px); animation: rise .7s var(--ease) forwards; animation-delay: calc(var(--d, 0) * 90ms + 100ms) }
        @keyframes rise { to { opacity: 1; transform: none } }

        @media(max-width:650px) {
            .fields { grid-template-columns: 1fr }
            .wrap { padding: 22px 12px 8px }
            .panel { padding: 18px }
            .hero { padding-left: 16px }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important }
            .rise { opacity: 1; transform: none }
        }
    </style>
</head>

<body>
    <div class="bg" aria-hidden="true"><span></span><span></span></div>
    <main class="wrap">
        <header class="hero rise" style="--d:0">
            <h1 style="font-family:Calibri, sans-serif; font-weight:600; color:#000;">
                Gerador de assinatura
                <span style="color:#555555; font-weight:700;">Cohab</span>
                <span style="color:#c14423; font-weight:700;">Minas</span>
            </h1>
            <p>Preencha os dados e exporte a assinatura como JPEG. O telefone celular é opcional e não aparece quando
                fica vazio.</p>
        </header>
        <section class="panel rise" style="--d:1">
            <div class="fields">
                <div class="rise" style="--d:2"><label for="nome">Nome completo</label><input id="nome" placeholder="Insira seu nome"></div>
                <div class="rise" style="--d:3"><label for="cargo">Cargo</label><input id="cargo" placeholder="Insira seu cargo"></div>
                <div class="rise" style="--d:4"><label for="setor">Setor / função</label><input id="setor"
                        placeholder="Insira seu setor ou função"></div>
                <div class="rise" style="--d:5"><label for="telefone">Telefone</label><input id="telefone" value="(31) 3915-XXXX"></div>
                <div class="rise" style="--d:6"><label for="celular">Celular ou outro telefone (opcional)</label><input id="celular" placeholder="(31) 9XXXX-XXXX">
                </div>
                <div class="rise" style="--d:7"><label for="email">E-mail </label><input id="email"
                        placeholder="Insira seu e-mail (antes do @)"></div>
            </div>
            <div class="actions rise" style="--d:8"><button id="exportar">Exportar JPEG</button><button class="secondary"
                    id="atualizar">Atualizar prévia</button></div>
        </section>
        <section class="panel rise" style="--d:9">
            <div class="preview-head"><span class="live-dot" aria-hidden="true"></span>Prévia ao vivo</div>
            <div class="preview"><canvas id="arte" width="2048" height="962"
                    aria-label="Prévia da assinatura de e-mail"></canvas></div>
        </section>
    </main>
    <footer>Assessoria de Comunicação Cohab Minas 2026</footer>
    <div class="toast" id="toast" role="status" aria-live="polite">Assinatura exportada com sucesso</div>
